services:
  bfanodo:
    image: ${BFANODO_IMAGE}:${BFANODO_TAG}
    # Por qué esta imagen y no un geth/client-go moderno: ver "Nota técnica"
    # en el README. Resumen: la red BFA en producción todavía corre nodos
    # geth v1.9.22 (2020) y, verificado en vivo, esos nodos no completan el
    # handshake RLPx con clientes ethereum/client-go v1.10.26 ni v1.13.15 —
    # solo con clientes de esa misma generación vieja, que es justamente lo
    # que trae esta imagen (compilada desde el fork "nucleo" de BFA).
    platform: ${BFANODO_PLATFORM}
    container_name: ${BFANODO_CONTAINER_NAME}
    restart: ${BFANODO_RESTART_POLICY}
    mem_limit: ${BFANODO_MEM_LIMIT}
    ports:
      # JSON-RPC HTTP y WebSocket: por defecto solo accesibles desde el propio
      # host (ver BFANODO_RPC_BIND en .env).
      - "${BFANODO_RPC_BIND}:${BFANODO_HTTP_PORT}:8545"
      - "${BFANODO_RPC_BIND}:${BFANODO_WS_PORT}:8546"
      # P2P: debe quedar abierto al mundo para que el nodo pueda descubrir
      # peers y sincronizar.
      - "${BFANODO_P2P_PORT}:30303/tcp"
      - "${BFANODO_P2P_PORT}:30303/udp"
    volumes:
      # Bind mount a disco (externo por default, ver BFANODO_DATA_DIR en
      # .env) en vez de un volumen Docker: así la blockchain persiste fuera
      # del disco interno y es fácil de ubicar/respaldar desde el host.
      - ${BFANODO_DATA_DIR}:/home/bfa
    healthcheck:
      test: ["CMD", "nc", "-z", "-w", "2", "127.0.0.1", "8545"]
      interval: ${BFANODO_HEALTHCHECK_INTERVAL}
      timeout: ${BFANODO_HEALTHCHECK_TIMEOUT}
      start_period: ${BFANODO_HEALTHCHECK_START_PERIOD}
      retries: ${BFANODO_HEALTHCHECK_RETRIES}
